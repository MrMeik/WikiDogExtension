name: Package and Release Extension

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chrome: the repo manifest is used as-is (service_worker only)
      - name: Build Chrome Extension ZIP
        run: |
          zip -r extension-chrome.zip . -x "*.git*" "*.github*" "README.md"

      # Firefox: copy the sources, then swap service_worker for scripts
      - name: Prepare Firefox build directory
        run: |
          mkdir -p build/firefox
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='build' \
            --exclude='extension-chrome.zip' \
            ./ build/firefox/

          jq '.background |= ({scripts: [.service_worker]} + del(.service_worker))' \
            manifest.json > build/firefox/manifest.json

          echo "Firefox background block:"
          jq '.background' build/firefox/manifest.json

      - name: Sign Firefox XPI
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir=build/firefox \
            --artifacts-dir=web-ext-artifacts \
            --channel=unlisted

      - name: Rename signed XPI
        run: |
          mv web-ext-artifacts/*.xpi ./extension-firefox.xpi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension-chrome.zip
            extension-firefox.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
